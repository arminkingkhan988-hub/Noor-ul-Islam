<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#075b45">
<title>نورالاسلام | Noor-ul-Islam</title>

<style>
:root {
  --green: #075b45;
  --green2: #0b795a;
  --bg: #f2f7f3;
  --card: #ffffff;
  --text: #17352a;
  --muted: #687b71;
  --border: #dce9df;
  --gold: #c79b35;
  --danger: #b42318;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, "Noto Naskh Arabic", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.9;
}
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
header {
  background: linear-gradient(135deg, var(--green), var(--green2));
  color: white;
  padding: 23px 16px 20px;
  text-align: center;
  border-radius: 0 0 24px 24px;
}
header h1 { margin: 0; font-size: 29px; }
header p { margin: 4px 0 10px; }
.badge {
  display: inline-block;
  border: 1px solid #ffffff70;
  border-radius: 30px;
  padding: 3px 12px;
  font-size: 12px;
}
.container { max-width: 850px; margin: auto; padding: 15px; }
.searchbox {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 12px;
  background: white;
  outline-color: var(--green2);
  margin-bottom: 13px;
}
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  margin-bottom: 15px;
}
.stat {
  background: white;
  padding: 10px 4px;
  text-align: center;
  border: 1px solid var(--border);
  border-radius: 13px;
  font-size: 12px;
}
.stat strong { display: block; font-size: 18px; color: var(--green); }
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 11px;
}
.card {
  border: 1px solid var(--border);
  background: var(--card);
  border-radius: 15px;
  padding: 14px;
  text-align: right;
  color: var(--text);
  min-width: 0;
}
.card:active { transform: scale(.99); }
.icon { font-size: 27px; display: block; }
.card h3 { margin: 3px 0; font-size: 16px; }
.card p { margin: 0; font-size: 12px; color: var(--muted); }
.section-title { font-size: 19px; margin: 18px 0 10px; }
.panel {
  display: none;
  background: white;
  border: 1px solid var(--border);
  border-radius: 17px;
  padding: 16px;
  overflow-wrap: anywhere;
}
.panel h2 { color: var(--green); margin-top: 3px; }
.panel h3 { color: var(--green); }
.back {
  border: 0;
  background: var(--green);
  color: white;
  border-radius: 10px;
  padding: 8px 15px;
  margin-bottom: 12px;
}
.item {
  background: #f5faf6;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  margin: 10px 0;
}
.item h3 { margin-top: 0; }
.small { font-size: 13px; color: var(--muted); }
.action {
  border: 0;
  background: var(--green);
  color: white;
  padding: 7px 12px;
  border-radius: 9px;
  margin: 4px 0;
}
.secondary { background: #e5f2e9; color: var(--green); }
.error { color: var(--danger); }
.arabic {
  font-family: "Noto Naskh Arabic", serif;
  font-size: 25px;
  line-height: 2.1;
  text-align: center;
  direction: rtl;
}
footer {
  text-align: center;
  padding: 24px 10px;
  font-size: 12px;
  color: var(--muted);
}
.hidden { display: none !important; }
@media (min-width: 600px) {
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
</style>
</head>

<body>
<header>
  <h1 id="appTitle">نورالاسلام</h1>
  <p id="appSubtitle">د اسلامي زده کړو وړیا کتابتون</p>
  <span class="badge">وړیا · بې اعلانونو · آفلاین</span>
</header>

<main class="container">
  <select id="language" class="searchbox" aria-label="Language">
    <option value="ps">پښتو</option>
    <option value="ar">العربية</option>
    <option value="en">English</option>
  </select>

  <input id="search" class="searchbox" type="search"
         placeholder="لټون: اودس، لمونځ، روژه، قرآن..." />

  <div class="stats">
    <div class="stat"><strong id="topicCount">—</strong>اسلامي موضوعات</div>
    <div class="stat"><strong>114</strong>سورتونه</div>
    <div class="stat"><strong id="savedCount">0</strong>خوندي شوي</div>
  </div>

  <h2 class="section-title" id="homeHeading">د زده کړو برخې</h2>
  <div id="grid" class="grid"></div>

  <section id="panel" class="panel">
    <button class="back" id="backButton">← بېرته</button>
    <div id="panelContent"></div>
  </section>

  <p id="status" class="small" role="status"></p>
</main>

<footer>
  <div>نورالاسلام | Noor-ul-Islam</div>
  <div>وړیا · بې اعلانونو · د آفلاین کار لپاره جوړ شوی</div>
  <div>د دیني احکامو د کره‌والي لپاره له باوري عالم سره هم مشوره وکړئ.</div>
</footer>

<script>
"use strict";

const $ = id => document.getElementById(id);

const translations = {
  ps: {
    title: "نورالاسلام",
    subtitle: "د اسلامي زده کړو وړیا کتابتون",
    search: "لټون: اودس، لمونځ، روژه، قرآن...",
    heading: "د زده کړو برخې",
    back: "← بېرته",
    loading: "معلومات لوستل کېږي...",
    dataError: "د اسلامي معلوماتو فایل ونه لوستل شو. د data/islamic.json فایل شتون او JSON جوړښت وګورئ.",
    noResults: "د لټون نتیجه پیدا نه شوه.",
    lessons: "اسلامي درسونه",
    lessonsDesc: "د عقیدې، عبادت او اسلامي ژوند تفصیلي معلومات",
    quran: "قرآن کریم",
    quranDesc: "د سورتونو لېست او د آیتونو لوستل",
    bookmarks: "خوندي شوي",
    bookmarksDesc: "خپل خوښ درسونه دلته وګورئ",
    saved: "خوندي کول",
    remove: "له خوندي شوو څخه لرې کول",
    noSaved: "تر اوسه مو څه نه دي خوندي کړي.",
    noTopics: "په معلوماتو فایل کې موضوعات نشته.",
    noSections: "د دې موضوع لپاره تفصیلي برخې نه دي موندل شوي.",
    quranError: "د قرآن د معلوماتو فایل ونه لوستل شو.",
    surahs: "د قرآن سورتونه",
    topicCount: "اسلامي موضوعات",
    savedCount: "خوندي شوي",
    audioUnavailable: "د آډیو لپاره انټرنېټ ته اړتیا ده.",
    readMore: "تفصیل",
    home: "کور",
    dataLoaded: "اسلامي معلومات ولوستل شول."
  },
  ar: {
    title: "نور الإسلام",
    subtitle: "مكتبة مجانية للتعلم الإسلامي",
    search: "بحث: الوضوء، الصلاة، الصيام، القرآن...",
    heading: "أقسام التعلم",
    back: "← رجوع",
    loading: "جارٍ تحميل المعلومات...",
    dataError: "تعذر تحميل ملف المعلومات الإسلامية. تحقق من data/islamic.json.",
    noResults: "لم يتم العثور على نتائج.",
    lessons: "الدروس الإسلامية",
    lessonsDesc: "العقيدة والعبادات والحياة الإسلامية",
    quran: "القرآن الكريم",
    quranDesc: "قائمة السور وقراءة الآيات",
    bookmarks: "المحفوظات",
    bookmarksDesc: "اعرض الدروس المحفوظة",
    saved: "حفظ",
    remove: "إزالة من المحفوظات",
    noSaved: "لا توجد عناصر محفوظة بعد.",
    noTopics: "لا توجد موضوعات في ملف البيانات.",
    noSections: "لا توجد تفاصيل لهذا الموضوع.",
    quranError: "تعذر تحميل ملف بيانات القرآن.",
    surahs: "سور القرآن",
    topicCount: "الموضوعات",
    savedCount: "المحفوظات",
    audioUnavailable: "تشغيل الصوت يحتاج إلى الإنترنت.",
    readMore: "التفاصيل",
    home: "الرئيسية",
    dataLoaded: "تم تحميل المعلومات."
  },
  en: {
    title: "Noor-ul-Islam",
    subtitle: "Free Islamic learning library",
    search: "Search: Wudu, Salah, Fasting, Quran...",
    heading: "Learning Sections",
    back: "← Back",
    loading: "Loading information...",
    dataError: "Could not load Islamic data. Check data/islamic.json.",
    noResults: "No results found.",
    lessons: "Islamic Lessons",
    lessonsDesc: "Detailed topics on faith, worship and Islamic life",
    quran: "The Holy Quran",
    quranDesc: "Surah list and verse reading",
    bookmarks: "Bookmarks",
    bookmarksDesc: "View your saved lessons",
    saved: "Bookmark",
    remove: "Remove bookmark",
    noSaved: "You have not saved anything yet.",
    noTopics: "No topics found in the data file.",
    noSections: "No detailed sections were found for this topic.",
    quranError: "Could not load the Quran data file.",
    surahs: "Quran Surahs",
    topicCount: "Islamic Topics",
    savedCount: "Saved",
    audioUnavailable: "Audio playback requires internet access.",
    readMore: "Details",
    home: "Home",
    dataLoaded: "Islamic information loaded."
  }
};

let lang = localStorage.getItem("noorLanguage") || "ps";
let islamicData = null;
let quranData = null;
let currentView = "home";
let currentTopic = null;
let currentSurah = null;

function t(key) {
  return (translations[lang] && translations[lang][key]) ||
         translations.ps[key] || key;
}

function safeString(value) {
  if (value === null || value === undefined) return "";
  if (typeof value === "string" || typeof value === "number") {
    return String(value);
  }
  return "";
}

function escapeHTML(value) {
  return safeString(value).replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[ch]);
}

function pickText(value) {
  if (typeof value === "string" || typeof value === "number") {
    return String(value);
  }
  if (!value || typeof value !== "object") return "";
  return value[lang] || value.ps || value.ar || value.en ||
         value.text || value.title || value.name || "";
}

function setStatus(message, isError = false) {
  $("status").textContent = message || "";
  $("status").className = isError ? "small error" : "small";
}

function setLanguage() {
  lang = $("language").value;
  localStorage.setItem("noorLanguage", lang);

  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "en" ? "ltr" : "rtl";
  $("appTitle").textContent = t("title");
  $("appSubtitle").textContent = t("subtitle");
  $("search").placeholder = t("search");
  $("homeHeading").textContent = t("heading");
  $("backButton").textContent = t("back");
  $("savedCount").textContent = getBookmarks().length;

  renderHome();

  if (currentView === "topic" && currentTopic !== null) {
    showIslamicTopic(currentTopic);
  } else if (currentView === "quran") {
    renderQuran();
  } else if (currentView === "surah" && currentSurah !== null) {
    showSurah(currentSurah);
  } else if (currentView === "bookmarks") {
    showBookmarks();
  }
}

function getBookmarks() {
  try {
    const result = JSON.parse(localStorage.getItem("noorBookmarks") || "[]");
    return Array.isArray(result) ? result : [];
  } catch (_) {
    return [];
  }
}

function saveBookmarks(list) {
  localStorage.setItem("noorBookmarks", JSON.stringify(list));
  $("savedCount").textContent = list.length;
}

function isBookmarked(id) {
  return getBookmarks().some(item => item.id === id);
}

function toggleBookmark(id, title, text) {
  let list = getBookmarks();
  if (list.some(item => item.id === id)) {
    list = list.filter(item => item.id !== id);
  } else {
    list.push({ id, title, text });
  }
  saveBookmarks(list);

  if (currentView === "topic" && currentTopic !== null) {
    showIslamicTopic(currentTopic);
  } else if (currentView === "bookmarks") {
    showBookmarks();
  }
  renderHome();
}

async function loadIslamicData() {
  if (islamicData) return islamicData;

  // MainActivity loads index.html from /assets/index.html.
  // This URL resolves to /assets/data/islamic.json.
  const response = await fetch("data/islamic.json");

  if (!response.ok) {
    throw new Error("islamic.json HTTP " + response.status);
  }

  const data = await response.json();

  if (Array.isArray(data)) {
    islamicData = data;
  } else if (data && Array.isArray(data.topics)) {
    islamicData = data.topics;
  } else if (data && Array.isArray(data.sections)) {
    islamicData = data.sections;
  } else {
    throw new Error("Unexpected Islamic JSON structure");
  }

  $("topicCount").textContent = islamicData.length;
  return islamicData;
}

async function loadQuranData() {
  if (quranData) return quranData;

  const response = await fetch("data/quran.json");

  if (!response.ok) {
    throw new Error("quran.json HTTP " + response.status);
  }

  const data = await response.json();

  if (Array.isArray(data)) {
    quranData = data;
  } else if (data && Array.isArray(data.surahs)) {
    quranData = data.surahs;
  } else if (data && Array.isArray(data.data)) {
    quranData = data.data;
  } else {
    throw new Error("Unexpected Quran JSON structure");
  }

  return quranData;
}

function getTopicTitle(topic) {
  return pickText(topic.title || topic.name || topic.heading ||
                  topic.title_ps || topic.name_ps) || "موضوع";
}

function getTopicDescription(topic) {
  return pickText(topic.description || topic.intro || topic.summary ||
                  topic.text || topic.description_ps);
}

function getTopicSections(topic) {
  if (Array.isArray(topic.sections)) return topic.sections;
  if (Array.isArray(topic.lessons)) return topic.lessons;
  if (Array.isArray(topic.items)) return topic.items;
  return [];
}

function showHome() {
  currentView = "home";
  currentTopic = null;
  currentSurah = null;
  $("grid").style.display = "grid";
  $("panel").style.display = "none";
  $("homeHeading").style.display = "block";
  $("search").style.display = "block";
  renderHome();
}

function showPanel(title, html) {
  $("grid").style.display = "none";
  $("homeHeading").style.display = "none";
  $("search").style.display = "none";
  $("panel").style.display = "block";
  $("panelContent").innerHTML =
    "<h2>" + escapeHTML(title) + "</h2>" + html;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderHome() {
  const grid = $("grid");
  grid.innerHTML = "";
  $("savedCount").textContent = getBookmarks().length;

  const query = $("search").value.trim().toLowerCase();

  const cards = [
    {
      icon: "📚",
      title: t("lessons"),
      description: t("lessonsDesc"),
      action: "lessons"
    },
    {
      icon: "📖",
      title: t("quran"),
      description: t("quranDesc"),
      action: "quran"
    },
    {
      icon: "⭐",
      title: t("bookmarks"),
      description: t("bookmarksDesc"),
      action: "bookmarks"
    }
  ];

  cards.forEach(card => {
    const haystack = (card.title + " " + card.description).toLowerCase();
    if (query && !haystack.includes(query)) return;

    const button = document.createElement("button");
    button.className = "card";
    button.innerHTML =
      '<span class="icon">' + card.icon + '</span>' +
      '<h3>' + escapeHTML(card.title) + '</h3>' +
      '<p>' + escapeHTML(card.description) + '</p>';

    button.addEventListener("click", () => {
      if (card.action === "lessons") openIslamicLesson();
      if (card.action === "quran") openQuran();
      if (card.action === "bookmarks") showBookmarks();
    });
    grid.appendChild(button);
  });

  if (!query) return;

  if (islamicData) {
    islamicData.forEach((topic, index) => {
      const title = getTopicTitle(topic);
      const description = getTopicDescription(topic);
      const haystack = (title + " " + description).toLowerCase();

      if (!haystack.includes(query)) return;

      const button = document.createElement("button");
      button.className = "card";
      button.innerHTML =
        '<span class="icon">🕌</span><h3>' +
        escapeHTML(title) + '</h3><p>' +
        escapeHTML(description.slice(0, 100)) + '</p>';

      button.addEventListener("click", () => showIslamicTopic(index));
      grid.appendChild(button);
    });
  }

  if (!grid.children.length) {
    grid.innerHTML = '<div class="item">' + escapeHTML(t("noResults")) + '</div>';
  }
}

async function openIslamicLesson() {
  currentView = "lessons";
  showPanel(t("lessons"), '<p>' + escapeHTML(t("loading")) + '</p>');

  try {
    const topics = await loadIslamicData();

    if (!topics.length) {
      $("panelContent").innerHTML =
        '<h2>' + escapeHTML(t("lessons")) + '</h2><p>' +
        escapeHTML(t("noTopics")) + '</p>';
      return;
    }

    let html = "";
    topics.forEach((topic, index) => {
      const title = getTopicTitle(topic);
      const description = getTopicDescription(topic);

      html += '<button class="card" style="width:100%;margin:5px 0" ' +
        'data-topic-index="' + index + '">' +
        '<h3>📘 ' + escapeHTML(title) + '</h3>' +
        '<p>' + escapeHTML(description.slice(0, 180)) + '</p></button>';
    });

    $("panelContent").innerHTML =
      '<h2>' + escapeHTML(t("lessons")) + '</h2>' + html;

    $("panelContent").querySelectorAll("[data-topic-index]").forEach(button => {
      button.addEventListener("click", () => {
        showIslamicTopic(Number(button.dataset.topicIndex));
      });
    });

    $("topicCount").textContent = topics.length;
    setStatus(t("dataLoaded"));
  } catch (error) {
    console.error("Islamic data loading error:", error);
    $("panelContent").innerHTML =
      '<h2>' + escapeHTML(t("lessons")) + '</h2>' +
      '<p class="error">' + escapeHTML(t("dataError")) + '</p>' +
      '<p class="small">' + escapeHTML(error.message) + '</p>';
    setStatus(t("dataError"), true);
  }
}

function showIslamicTopic(index) {
  if (!Array.isArray(islamicData) || !islamicData[index]) {
    openIslamicLesson();
    return;
  }

  currentView = "topic";
  currentTopic = index;

  const topic = islamicData[index];
  const title = getTopicTitle(topic);
  const description = getTopicDescription(topic);
  const sections = getTopicSections(topic);
  const topicId = "topic-" + index;

  let html = "";

  if (description) {
    html += '<div class="item">' + escapeHTML(description) + '</div>';
  }

  if (!sections.length) {
    const body = pickText(topic.content || topic.details || topic.body ||
                          topic.text || topic.description);

    html += body
      ? '<div class="item">' + escapeHTML(body) + '</div>'
      : '<p>' + escapeHTML(t("noSections")) + '</p>';
  } else {
    sections.forEach((section, i) => {
      if (typeof section === "string") {
        html += '<article class="item"><h3>' + (i + 1) +
                '</h3><p>' + escapeHTML(section) + '</p></article>';
        return;
      }

      const heading = pickText(section.heading || section.title ||
                               section.name || section.question);
      const body = pickText(section.text || section.content ||
                            section.description || section.answer ||
                            section.details || section.body);

      html += '<article class="item">';
      if (heading) html += '<h3>' + escapeHTML(heading) + '</h3>';
      if (body) html += '<div>' + escapeHTML(body) + '</div>';

      if (!heading && !body) {
        html += '<p>' + escapeHTML(JSON.stringify(section)) + '</p>';
      }

      html += '</article>';
    });
  }

  const saved = isBookmarked(topicId);
  html =
    '<button class="action secondary" id="bookmarkTopic">' +
    (saved ? '★ ' + escapeHTML(t("remove")) : '☆ ' + escapeHTML(t("saved"))) +
    '</button>' + html;

  showPanel(title, html);

  $("bookmarkTopic").addEventListener("click", () => {
    toggleBookmark(topicId, title, description);
  });
}

function showBookmarks() {
  currentView = "bookmarks";
  currentTopic = null;

  const list = getBookmarks();
  let html = "";

  if (!list.length) {
    html = '<p>' + escapeHTML(t("noSaved")) + '</p>';
  } else {
    list.forEach(item => {
      html += '<article class="item"><h3>' +
        escapeHTML(item.title) + '</h3><p>' +
        escapeHTML(item.text || "") + '</p>' +
        '<button class="action secondary" data-remove="' +
        escapeHTML(item.id) + '">' + escapeHTML(t("remove")) +
        '</button></article>';
    });
  }

  showPanel(t("bookmarks"), html);

  $("panelContent").querySelectorAll("[data-remove]").forEach(button => {
    button.addEventListener("click", () => {
      const id = button.dataset.remove;
      saveBookmarks(getBookmarks().filter(item => item.id !== id));
      showBookmarks();
    });
  });
}

async function openQuran() {
  currentView = "quran";
  currentSurah = null;
  showPanel(t("quran"), '<p>' + escapeHTML(t("loading")) + '</p>');

  try {
    await loadQuranData();
    renderQuran();
  } catch (error) {
    console.error("Quran loading error:", error);
    $("panelContent").innerHTML =
      '<h2>' + escapeHTML(t("quran")) + '</h2><p class="error">' +
      escapeHT
